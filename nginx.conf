# The build generates a "<name>.png.webp" next to every png/jpg. Serve those
# to clients that accept webp, without needing <picture> markup in 522 posts.
map $http_accept $webp_suffix {
    default        "";
    "~*image/webp" ".webp";
}

server {
    listen       80;
    server_name  www.growse.com;

    root /usr/share/nginx/html;

    # Emit relative Location headers so redirects keep the scheme, host and
    # port the client actually used (nginx would otherwise rebuild them from
    # $host, dropping any non-default port).
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/xml text/plain application/javascript application/json application/xml application/rss+xml application/atom+xml application/jrd+json image/svg+xml;

    # Feeds the post list nav. Regenerated whenever a post is published, so it
    # cannot be immutable, but it is bigger than most pages and was previously
    # refetched in full on every navigation.
    location = /posts.json {
        expires 1h;
    }

    # Pagefind names its index chunks, fragments and metadata by content hash,
    # so they can be cached indefinitely. pagefind.js, pagefind-entry.json and
    # the wasm keep stable URLs across rebuilds and must keep revalidating.
    location ~* ^/pagefind/.+\.(pf_index|pf_fragment|pf_meta)$ {
        expires max;
    }

    location ~* ^/assets/img/.+\.(png|jpe?g)$ {
        add_header Vary Accept;
        try_files $uri$webp_suffix $uri =404;
    }

    location / {
        index  index.html index.htm;

        location ~* "/assets/.*\.(woff|woff2|css|js)" {
            expires max;
        }
    }
    location ~ ^/$ {
        return 302 %FRONTPAGE%;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$server_name$request_uri;
    }
    location = /.well-known/webfinger {
        root /usr/share/nginx/html;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        default_type application/jrd+json;
        add_header Access-Control-Allow-Origin "*";
    }
}

server {
    listen 80;
    server_name growse.com;
    return 301 https://www.growse.com$request_uri;
}

server {
    listen 80;
    server_name growse.me.uk;
    return 301 https://www.growse.com$request_uri;
}
